const works=['Assembly','Mika / first bell','Cross-talk','Ren / corridor','The long room','Three witnesses','Sora / false smile','Contact','Nine seconds','Aki / overpaint','Underpass','Last frame'];
const alts=['Four recurring students assembled as layered portraits','Close portrait of Mika under scratched ink','Mika and Ren overlapping in fractured exposures','Close portrait of Ren in a warm corridor','Two students separated by a long painted shadow','Three uniformed witnesses in a rough storyboard room','Sora smiling beneath frantic black hatching','Aki and Ren facing each other across small witnesses','Three faces colliding as remembered fragments','Aki repainted across two offset exposures','Mika and Ren beneath an underpass of ink','The full cast returning in a final assembly'];
let current=0,timer=null,start=0,duration=2800;const art=document.querySelector('#art'),nextArt=document.querySelector('#nextArt'),film=document.querySelector('#film'),bar=document.querySelector('#bar'),play=document.querySelector('#play');
works.forEach((w,i)=>{const b=document.createElement('button');b.className='thumb'+(i===0?' active':'');b.setAttribute('aria-label',`Show ${w}`);b.innerHTML=`<img src="${frames[i]}" alt=""><small>${String(i+1).padStart(2,'0')}</small>`;b.onclick=()=>show(i);film.append(b)});
function show(i){i=(i+works.length)%works.length;if(i===current)return;current=i;nextArt.src=frames[i];nextArt.alt=alts[i];nextArt.classList.remove('enter');void nextArt.offsetWidth;nextArt.classList.add('enter');setTimeout(()=>{art.src=nextArt.src;art.alt=nextArt.alt;nextArt.classList.remove('enter');nextArt.style.opacity=0},220);document.querySelector('#title').textContent=works[i];document.querySelector('#num').textContent=String(i+1).padStart(2,'0');document.querySelectorAll('.thumb').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('.thumb')[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});start=performance.now()}
document.querySelector('.prev').onclick=()=>show(current-1);document.querySelector('.next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key===' '){e.preventDefault();toggle()}});
let sx=0;document.querySelector('#canvas').addEventListener('pointerdown',e=>sx=e.clientX);document.querySelector('#canvas').addEventListener('pointerup',e=>{if(Math.abs(e.clientX-sx)>50)show(current+(e.clientX<sx?1:-1))});
function tick(t){if(timer){let p=(t-start)/duration;if(p>=1){show(current+1);p=0}bar.style.width=Math.min(100,p*100)+'%'}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function toggle(){timer=timer?null:true;start=performance.now();play.querySelector('b').textContent=timer?'Ⅱ':'▶';if(!timer)bar.style.width='0'}play.onclick=toggle;
</script></body></html>
